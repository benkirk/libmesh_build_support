# Adapted from benkirk/demo_github_actions' 'slim-action-runner', which is in
# turn InstructLab's 'Free Disk Space'.  What changed and why is documented at
# the top of free-disk.sh, next to the code that embodies it.
#
# The logic lives in free-disk.sh rather than inline here so that .github/
# workflows/checks.yml gates it: 'bash -n' and shellcheck run over
# git ls-files '*.sh', and a composite action's inline 'run:' block is invisible
# to both.
name: Free disk space
description: >
  Reclaim runner disk: move Docker's data root onto a large ephemeral disk where
  one exists, and optionally delete runner software this build never uses.  Both
  halves are currently unnecessary on GitHub-hosted runners -- see the measured
  numbers at the top of free-disk.sh -- and both are kept for the configurations
  where they are not.

inputs:
  docker-root:
    description: >
      Where Docker's data root should end up, on a runner that has a separate
      filesystem to put it on.  Skipped when there is not one, which is every
      GitHub-hosted runner as of this writing.
    required: false
    default: /mnt/docker
  aggressive:
    description: >
      Also delete the runner's preinstalled JVMs, .NET, Android SDK and friends.
      Off by default because the build currently uses ~3 GB of an available 84.
      The reason to reach for it is a bigger builder -- a second compiler family
      in the conda env, say -- and the first run that turns it on will print
      what it reclaimed, which is the number nobody has yet.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      env:
        DOCKER_ROOT: ${{ inputs.docker-root }}
        AGGRESSIVE: ${{ inputs.aggressive }}
      run: bash "${GITHUB_ACTION_PATH}/free-disk.sh"
