# The default configuration, on both target platforms, on every pull request.
#
# This is the one that has to stay green: openblas + mpich + serial HDF5, built
# on almalinux:9, verified on all five base images.  It is exactly the
# configuration verified by hand in #4 and #5, so a red job here means
# something changed rather than something was never true.
#
# linux-64 and linux-aarch64 both run, both natively.  aarch64 is a shipping
# target, not a nice-to-have, and it is the platform where the interesting
# findings have come from so far -- the armv8.1-a floor was measured there.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      aggressive_sweep:
        description: >
          Delete the runner's preinstalled toolchains before building, and
          report what that reclaimed.  Nothing needs this today; it is here so
          the capability can be exercised and measured on demand rather than
          discovered to be broken on the day it is wanted.
        type: boolean
        default: false
      profile_isa_scan:
        description: >
          Measure where the ISA scan spends its 20 minutes on x86-64 — objdump
          versus Python, threads versus processes.  Adds minutes to the build
          and changes nothing about what the gate reports.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pushes to a PR branch are cancelled; main is not, because the
  # tarball published from a main build is the one people go looking for.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Two profiles now, on both platforms.  'default' is the pairing this project
  # has always shipped and is the one that must stay green; 'bleeding' is the
  # newer PETSc/libMesh/Trilinos set, and it is here rather than in extended.yml
  # because a version pairing that is only checked weekly is a pairing nobody
  # finds out about until Monday.
  #
  # It costs a second build per platform per PR, and two things hold that down
  # until it has earned its place: it verifies on two base images rather than
  # five (the glibc floor and a current distro -- what changes between profiles
  # is what gets compiled, not how it relocates, and ci.yml's default legs
  # already sweep the distro matrix), and it is experimental, so a red bleeding
  # leg reports through the sidecar and the summarise job instead of blocking a
  # PR that has nothing to do with it.  Both are temporary: when it has been
  # green for a few weeks, drop 'experimental' and give it the full verify set.
  stack:
    strategy:
      fail-fast: false
      matrix:
        target_platform: [linux-64, linux-aarch64]
        profile: [default, bleeding]
    name: ${{ matrix.profile }} · ${{ matrix.target_platform }}
    uses: ./.github/workflows/stack.yml
    with:
      target_platform: ${{ matrix.target_platform }}
      profile: ${{ matrix.profile }}
      verify_bases: ${{ matrix.profile == 'default' && '' || 'almalinux:8 ubuntu:24.04' }}
      experimental: ${{ matrix.profile != 'default' }}
      # almalinux:9 because that is what the end-to-end runs in #4 used.  The
      # builder's own glibc barely matters -- conda supplies the compilers and
      # the sysroot pins GLIBC_FLOOR -- but "what we verified" beats "what we
      # reason should be equivalent".  Varying it is extended.yml's job.
      base_image: almalinux:9
      # Empty on push and pull_request, where the inputs context does not exist,
      # so || supplies the default that both of those want anyway.
      aggressive_sweep: ${{ inputs.aggressive_sweep || false }}
      profile_isa_scan: ${{ inputs.profile_isa_scan || false }}
      # PRs read, main writes.  A pull request can therefore never publish
      # something another run would later consume, and fork PRs -- whose
      # GITHUB_TOKEN is read-only and could not push anyway -- do not fail
      # trying.  When a restore path is built, this is already the right shape.
      publish_images: ${{ github.event_name != 'pull_request' }}
      # Both profiles publish from main, and the bleeding one is worth having:
      # its devel tag carries the profile, so 'make image-shell PROFILE=bleeding'
      # finds it.  'experimental' does not weaken that -- it tolerates a red job
      # in the run's conclusion, it does not let a failed build reach the publish
      # steps, which are ordinary steps after the ones that failed.
