# Reference spec.  The authoritative artifact is conda/lock/*.lock, regenerated
# by 'make conda-lock'.  Version pins here are templated by conda/bootstrap.sh
# from GCC_VERSION / GLIBC_FLOOR / MPI_VERSION / HDF5_VERSION / HDF5_PARALLEL.
#
# Three measured traps, all deliberately encoded:
#   libblas / liblapack  -- the bare metapackages drag in ~560 MB of MKL
#   mpich-mpicc etc.     -- stale; pin mpich back to 3.2.1 (2017)
#   bare hdf5            -- the feedstock adds +100 to the nompi build number,
#                           so an unqualified request resolves to serial by
#                           accident.  Pin the variant either way.  Serial is
#                           the default: it is what v0 shipped, and the mpi_*
#                           variant makes libhdf5 link libmpi.
name: stack
channels: [conda-forge]
dependencies:
  - gcc_linux-64=14
  - gxx_linux-64=14
  - gfortran_linux-64=14
  - sysroot_linux-64=2.28
  - cmake
  - ninja
  - make
  - pkg-config
  - patchelf   # see A15: conda-forge has no installable 0.18+
  - python
  - autoconf
  - automake
  - libtool
  - mpich=5.0.1
  - mkl
  - mkl-devel
  - blas=*=mkl
  - hdf5=1.14.*=nompi_*
  - zlib
  # libMesh's optional packages -- these are shipped, not build tools.  Without
  # them libMesh's configure probes the build HOST for each one and records what
  # it finds in the compile line it hands customers.  See conda/bootstrap.sh.
  - libboost-headers   # replaces libMesh's bundled Boost 1.61 subset
  - eigen=3.4.*        # NOT Eigen 5; headers land in include/eigen3
  - libtirpc           # rpc/xdr.h: gone from glibc 2.32, unusable in the 2.28 sysroot
  - xorg-libxt         # X11/Intrinsic.h, a build-time header dep of contrib/tecplot/tecio
  - xorg-xorgproto     # X11/X.h, which Xlib.h includes; a build-only dep of xorg-libx11
  - glpk               # nlopt is deliberately absent: no python-free build exists
